<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Cloud-native software supply chain security architecture</title><desc id="desc">Reviewed source passes through CI, scanning, SBOM, provenance and signing. Kubernetes admission verifies the artifact before runtime.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111d35"/></linearGradient><linearGradient id="ci"><stop stop-color="#173b67"/><stop offset="1" stop-color="#132b48"/></linearGradient><linearGradient id="sec"><stop stop-color="#164b4a"/><stop offset="1" stop-color="#123536"/></linearGradient><linearGradient id="run"><stop stop-color="#44306d"/><stop offset="1" stop-color="#2b214e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#89a9ce" stroke-width="1.5"/></marker><style>.zone{fill:#0b1727;stroke:#2b3e58;stroke-width:1.5}.zt{font:700 15px Arial;letter-spacing:2px;fill:#91a8c6}.n{stroke:#54708e;stroke-width:1.2;filter:url(#shadow)}.h{font:700 18px Arial;fill:#f4f7fb}.s{font:13px Arial;fill:#c0cee0}.e{fill:none;stroke:#89a9ce;stroke-width:2.2;marker-end:url(#a);stroke-dasharray:7 7;animation:f 2.2s linear infinite}.g{fill:none;stroke:#57d7bf;stroke-width:2.2;marker-end:url(#a);stroke-dasharray:5 8;animation:f 1.8s linear infinite}@keyframes f{to{stroke-dashoffset:-30}}</style></defs>
<rect width="1500" height="900" fill="url(#bg)"/><text x="64" y="65" font-family="Arial" font-size="30" font-weight="700" fill="#f7faff">SOFTWARE SUPPLY CHAIN · TRUST ARCHITECTURE</text><text x="66" y="94" font-family="Arial" font-size="15" fill="#9bb0ca">Verify every transition — source identity, build integrity, artifact evidence and runtime admission</text>
<rect class="zone" x="55" y="130" width="255" height="650" rx="20"/><text class="zt" x="80" y="165">01 · SOURCE</text><rect class="zone" x="330" y="130" width="640" height="650" rx="20"/><text class="zt" x="355" y="165">02 · BUILD &amp; EVIDENCE</text><rect class="zone" x="990" y="130" width="220" height="650" rx="20"/><text class="zt" x="1015" y="165">03 · ARTIFACT</text><rect class="zone" x="1230" y="130" width="215" height="650" rx="20"/><text class="zt" x="1255" y="165">04 · RUNTIME</text>
<rect class="n" x="82" y="220" width="200" height="110" rx="14" fill="url(#ci)"/><text x="105" y="255" class="h">⌘ Git Repository</text><text x="105" y="282" class="s">Protected branch</text><text x="105" y="305" class="s">Reviewed commit · tests</text>
<rect class="n" x="82" y="390" width="200" height="105" rx="14" fill="#182d48"/><text x="105" y="427" class="h">Pull Request Gate</text><text x="105" y="454" class="s">Reviews · checks · policy</text><text x="105" y="477" class="s">Dependency review</text>
<rect class="n" x="365" y="220" width="250" height="115" rx="14" fill="url(#ci)"/><text x="390" y="258" class="h">GitHub Actions</text><text x="390" y="285" class="s">Isolated CI runner</text><text x="390" y="308" class="s">OIDC · short-lived identity</text>
<rect class="n" x="670" y="220" width="250" height="115" rx="14" fill="url(#ci)"/><text x="695" y="258" class="h">BuildKit / OCI Build</text><text x="695" y="285" class="s">Pinned inputs · digest</text><text x="695" y="308" class="s">Reproducible build goal</text>
<rect class="n" x="365" y="405" width="250" height="125" rx="14" fill="url(#sec)"/><text x="390" y="445" class="h">Trivy Security Scan</text><text x="390" y="472" class="s">FS · image · misconfig</text><text x="390" y="497" class="s">Severity &amp; exception gate</text>
<rect class="n" x="670" y="405" width="250" height="125" rx="14" fill="url(#sec)"/><text x="695" y="445" class="h">Syft · SBOM</text><text x="695" y="472" class="s">SPDX / CycloneDX</text><text x="695" y="497" class="s">Bound to image digest</text>
<rect class="n" x="365" y="600" width="250" height="120" rx="14" fill="url(#sec)"/><text x="390" y="641" class="h">Provenance</text><text x="390" y="668" class="s">Builder · source · materials</text><text x="390" y="692" class="s">Attestation evidence</text>
<rect class="n" x="670" y="600" width="250" height="120" rx="14" fill="url(#sec)"/><text x="695" y="641" class="h">Cosign / Sigstore</text><text x="695" y="668" class="s">Sign immutable digest</text><text x="695" y="692" class="s">Identity + transparency</text>
<rect class="n" x="1015" y="300" width="170" height="145" rx="14" fill="#273956"/><text x="1040" y="345" class="h">OCI Registry</text><text x="1040" y="374" class="s">Image by digest</text><text x="1040" y="399" class="s">SBOM · signatures</text><text x="1040" y="424" class="s">Attestations</text>
<rect class="n" x="1250" y="220" width="175" height="125" rx="14" fill="url(#run)"/><text x="1270" y="260" class="h">Kubernetes API</text><text x="1270" y="288" class="s">Deployment request</text><text x="1270" y="312" class="s">Digest-pinned image</text>
<rect class="n" x="1250" y="410" width="175" height="140" rx="14" fill="url(#run)"/><text x="1270" y="452" class="h">Kyverno</text><text x="1270" y="480" class="s">Admission policy</text><text x="1270" y="505" class="s">Verify signature +</text><text x="1270" y="526" class="s">trusted identity</text>
<rect class="n" x="1250" y="620" width="175" height="105" rx="14" fill="#273956"/><text x="1270" y="660" class="h">Runtime</text><text x="1270" y="687" class="s">Prometheus · Grafana</text><text x="1270" y="709" class="s">Alerts · response</text>
<path class="e" d="M282 275 H365"/><path class="e" d="M615 275 H670"/><path class="e" d="M795 335 V405"/><path class="g" d="M795 335 V370 H490 V405"/><path class="e" d="M490 530 V600"/><path class="e" d="M795 530 V600"/><path class="g" d="M920 660 H1015 V445"/><path class="g" d="M920 275 H1015 V330"/><path class="e" d="M1185 370 H1250"/><path class="g" d="M1337 345 V410"/><path class="g" d="M1337 550 V620"/>
<text x="65" y="830" font-family="Arial" font-size="13" fill="#8fa5c1">DESIGN RULE: a green build is not runtime trust. The cluster independently verifies the artifact at admission.</text></svg>