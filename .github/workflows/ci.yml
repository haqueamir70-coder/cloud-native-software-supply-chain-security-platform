name: CI Security Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    name: Test, lint and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scan source dependencies and secrets with Trivy
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.76.1 fs \
            --scanners vuln,secret --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 /work

      - name: Scan Kubernetes manifests with Trivy
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.76.1 config \
            --severity HIGH,CRITICAL --exit-code 1 /work/k8s

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Validate Terraform configuration
        working-directory: terraform/azure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Validate and smoke test Compose stack
        run: |
          docker compose config --quiet
          docker compose up --build -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/metrics | grep -q http_requests_total
          curl --fail --silent http://127.0.0.1:9090/-/ready
          curl --fail --silent http://127.0.0.1:3000/api/health
          docker compose down --volumes

      - name: Validate Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Upload test result context
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"
