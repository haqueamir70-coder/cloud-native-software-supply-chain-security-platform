apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-demo-api
  namespace: supply-chain-demo
  labels:
    app.kubernetes.io/name: supply-chain-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-chain-demo-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/haqueamir70-coder/cloud-native-software-supply-chain-security-platform/api@sha256:5d01690245377b1be9bc4713af4c9953386f8888b86b3286b86796726d425c69
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: supply-chain-demo-api
  namespace: supply-chain-demo
spec:
  selector:
    app.kubernetes.io/name: supply-chain-demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
